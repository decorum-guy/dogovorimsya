name: dogovorimsya
services:
  app:
    build: .
    init: true
    mem_limit: 512m
    restart: unless-stopped
    stop_grace_period: 20s
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "3000"
      DATA_DIR: /app/data/private
      APP_ORIGIN: https://${DOMAIN:?Set DOMAIN in deploy/.env}
      COOKIE_SECURE: "true"
      TRUST_PROXY: "1"
    ports:
      - "127.0.0.1:${APP_BIND_PORT:-3000}:3000"
    volumes:
      - journal_data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/status').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
  caddy:
    image: caddy:2-alpine
    profiles: [https]
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in deploy/.env}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy
volumes:
  journal_data:
  caddy_data:
  caddy_config:
