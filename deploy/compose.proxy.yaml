# Attach only this application to an already running reverse proxy network.
# Existing proxy containers do not need to be restarted or reconnected.
services:
  app:
    networks:
      default:
      shared_proxy:
        aliases:
          - dogovorimsya-app
networks:
  shared_proxy:
    external: true
    name: ${PROXY_NETWORK:?Set the existing proxy network in deploy/.env}
